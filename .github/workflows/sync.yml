name: Synchronisation automatique

on:
  push:
    branches:
      - main  # Remplacez par 'master' si votre branche principale s'appelle master

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchroniser vers Compte B
        uses: repo-sync/github-sync@v2
        with:
          target_repo_token: ${{ secrets.SYNC_TOKEN }}
          destination_repo: "https://github.com/pixel-dev-26/api_fast_gstock.git"
          destination_branch: "main"
