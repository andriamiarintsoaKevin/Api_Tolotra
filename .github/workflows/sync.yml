name: Synchronisation automatique

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pousser directement vers le Compte B
        run: |
          git remote add target https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/pixel-dev-26/api_fast_gstock.git
          git push --force target main
